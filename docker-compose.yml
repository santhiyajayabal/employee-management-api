version: "3.8"

services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/employeedb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: JSa@180223
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JSa@180223
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: